# Memory for Gradle itself.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.caching=true

# Suppress Stonecutter's "Groovy buildscripts" notice - Groovy is intentional here.
dev.kikugie.stonecutter.hard_mode=true

# Minecraft 26.2 requires Java 25.
org.gradle.java.home=D:\\Java\\jdk-25.0.4.1+1

# Mod metadata, shared by every Minecraft version in this build.
group=org.envisioncraft
version=1.3-SNAPSHOT
archives_base_name=EnvCA

# Per-version dependency versions are in stonecutter.properties.toml.
