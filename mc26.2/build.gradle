plugins {
    id 'net.fabricmc.fabric-loom'
}

// ---------------------------------------------------------------------------
// Version resolution
//
// The active version is declared in stonecutter.gradle (Groovy). Stonecutter
// also mirrors it into the generated stonecutter.gradle.kts stub above - that
// stub is Stonecutter's own one-line controller and is intentionally left
// alone.
//
// Per-version dependency versions live in stonecutter.properties.toml. To add
// 26.3 later, add an entry to versions.json and a section to that TOML file;
// this script does not need to change.
//
// NOTE: the TOML file is parsed by hand below on purpose, so this build needs no
// extra plugin or library just to read three strings.
// ---------------------------------------------------------------------------

// versions/26.2 is a subproject while these files sit in the Stonecutter root
// (mc26.2/), so resolve them from rootDir rather than project.file.
def STONECUTTER_ROOT = rootDir
def ACTIVE_VERSION_PATTERN = ~/(?m)^\s*(?:sc|stonecutter)\s*\.?\s*active\s*\(?\s*["']([^"']+)["']/

def readActiveVersion = { String fileName ->
    def file = new File(STONECUTTER_ROOT, fileName)
    if (!file.isFile()) return null
    def matcher = ACTIVE_VERSION_PATTERN.matcher(file.getText('UTF-8'))
    return matcher.find() ? matcher.group(1) : null
}

// Either script may carry the declaration depending on which Stonecutter wrote
// last, and Groovy/Kotlin both bind the same version, so accept both.
def ACTIVE_VERSION = readActiveVersion('stonecutter.gradle')
        ?: readActiveVersion('stonecutter.gradle.kts')
        ?: { throw new GradleException("No active Stonecutter version found in ${STONECUTTER_ROOT}") }()

def tomlText = new File(STONECUTTER_ROOT, 'stonecutter.properties.toml').getText('UTF-8')
def section = null
def versionProps = [:]
tomlText.eachLine { rawLine ->
    def line = rawLine.trim()
    if (line.isEmpty() || line.startsWith('#')) return
    def sectionMatcher = line =~ /^\[(["']?)([^"'\]]+)\1\]$/
    if (sectionMatcher.matches()) {
        section = sectionMatcher[0][2]
        return
    }
    if (section == ACTIVE_VERSION) {
        def matcher = line =~ /^([\w.\-]+)\s*=\s*"(.*)"\s*$/
        if (matcher.matches()) versionProps[matcher[0][1]] = matcher[0][2]
    }
}

def MC_VERSION = ACTIVE_VERSION
def LOADER_VERSION = versionProps['version.fabric-loader']
def CARPET_VERSION = versionProps['version.carpet']
def FABRIC_API_VERSION = versionProps['version.fabric-api']

version = "${property('version')}+mc${MC_VERSION}"
base {
    archivesName = "${property('archives_base_name')}-${MC_VERSION}"
}

loom {
    mods {
        'envision-carpet-addition' {
            sourceSet sourceSets.main
        }
    }

    runs.configureEach { run ->
        // Keep the 26.2 dev environment in versions/26.2/run so it never mixes
        // assets or options with the 1.21.7 one in the repository root.
        run.runDir = project.layout.projectDirectory.dir('run').asFile
        run.vmArg '-Dmixin.debug.export=true'
    }
}

repositories {
    mavenCentral()
    // Carpet's own maven - the extension API this mod plugs into lives there.
    maven {
        name = 'Masa'
        url = 'https://masa.dy.fi/maven'
    }
}

dependencies {
    // Minecraft 26.2 ships unobfuscated, so Loom hands out Mojang names directly
    // and no mappings(...) declaration is needed. Fabric never published Yarn
    // mappings for 26.2 either.
    minecraft "com.mojang:minecraft:${MC_VERSION}"

    // With Loom 1.17 the plain configurations are already remapped into the
    // project namespace, so modImplementation / modCompileOnly are gone.
    implementation "net.fabricmc:fabric-loader:${LOADER_VERSION}"

    compileOnly "carpet:fabric-carpet:${CARPET_VERSION}"
    localRuntime "carpet:fabric-carpet:${CARPET_VERSION}"
    localRuntime "net.fabricmc.fabric-api:fabric-api:${FABRIC_API_VERSION}"
}

tasks.processResources {
    inputs.property 'version', version.toString()
    inputs.property 'minecraft', MC_VERSION
    inputs.property 'loader_version', LOADER_VERSION
    inputs.property 'java', '>=25'

    filesMatching('fabric.mod.json') {
        expand(
                'version'       : version.toString(),
                'minecraft'     : MC_VERSION,
                'loader_version': LOADER_VERSION,
                'java'          : '>=25',
        )
    }
}

java {
    withSourcesJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    // Minecraft 26.2 requires Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
